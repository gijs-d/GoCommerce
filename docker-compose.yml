services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - BASE_URL=http://localhost:8080
      - DATABASE_URL=postgres://shop_user:shop_password@postgres:5432/webshop_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - ./themes:/app/themes

  postgres:
    image: postgres:17-alpine
    container_name: shop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webshop_db
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d webshop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local